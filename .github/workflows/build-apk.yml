name: Build Media Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.86.2

      - name: Build APK
        run: |
          flet build apk --arch arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-APK
          path: build/apk/*.apk
          if-no-files-found: error
